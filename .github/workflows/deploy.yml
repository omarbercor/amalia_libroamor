name: Deploy to CloudPanel (Static Site)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
        continue-on-error: true

      - name: Install dependencies
        run: |
          # Si NVM o CloudPanel tiene Node en rutas de usuario, cargarlas en el PATH
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:$PATH"

          echo "Usando Node: $(which node || echo 'no encontrado')"
          echo "Usando NPM: $(which npm || echo 'no encontrado')"

          npm ci

      - name: Build Astro static site
        run: npm run build

      - name: Deploy dist to htdocs
        run: |
          # Detecta automáticamente la raíz htdocs de este sitio en CloudPanel
          # o sincroniza directamente al htdocs del usuario actual
          if [ -d "$HOME/htdocs" ]; then
            # Si el runner está en $HOME/actions-runner, htdocs está en $HOME/htdocs/dominio
            SITE_DIR=$(find "$HOME/htdocs" -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            # Si se colocó dentro de la carpeta del propio dominio:
            SITE_DIR="$HOME"
          fi

          echo "Carpeta destino detectada: $SITE_DIR"
          rsync -av --delete dist/ "$SITE_DIR/"
